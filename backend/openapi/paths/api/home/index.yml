    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              banners:
                type: array
                items:
                  $ref: '../../../components/schemas/banner.yml'
              collections:
                type: array
                items:
                  $ref: '../../../components/schemas/selection.yml'
